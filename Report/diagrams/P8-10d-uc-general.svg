<text x="436.5" y="107.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">1. Tài khoản và xác thực</text>
<text x="520.0" y="147.0" font-size="16" text-anchor="middle" dominant-baseline="central">Đăng ký, đăng nhập, quên mật khẩu, hồ sơ cá</text>
