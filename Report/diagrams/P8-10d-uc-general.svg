<text x="448.0" y="225.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">2. Trò chuyện và thông báo</text>
<text x="520.0" y="275.0" font-size="16" text-anchor="middle" dominant-baseline="central">Trò chuyện, thông báo đẩy, tùy chỉnh thông báo</text>
